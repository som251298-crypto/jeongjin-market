<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서울정진학교 정진시장</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="theme-color" content="#ffd9d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="정진시장">
<style>
*{box-sizing:border-box}
body{font-family:Arial,"Malgun Gothic",sans-serif;background:#fff8f1;margin:0;padding:12px;min-height:100vh;color:#29221f}
h1{text-align:center;background:#ffd9d9;padding:16px;border-radius:14px;margin:0 0 12px;font-size:26px}
.main-container{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(310px,1fr);gap:14px;align-items:start}
.left-panel{min-width:0}
.toolbar{background:white;padding:12px;border-radius:12px;margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;box-shadow:0 2px 5px #ddd}
.search{font-size:19px;padding:13px;border:2px solid #e3c8bd;border-radius:10px;flex:1;min-width:180px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{background:#f4ebe7;font-size:19px;padding:12px 18px;font-weight:bold;border:2px solid transparent}
.tab.active{background:#ffd9d9;border-color:#d08c8c}
.category-heading{font-size:24px;margin:12px 2px 10px;background:#fff0e7;padding:10px;border-left:6px solid #cf8b75;border-radius:6px}
.product-section{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px;margin-bottom:20px}
.card{background:#fff;padding:12px;border-radius:12px;box-shadow:0 2px 5px #ddd;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:435px;gap:8px}
.card img{width:100%;height:290px;object-fit:contain;border-radius:9px;background:#fff}
.product-name{font-size:22px;font-weight:bold;line-height:1.25;overflow-wrap:anywhere;flex:1;display:flex;align-items:center}
.price{font-size:20px;font-weight:bold;color:#555}
.purchase-controls{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;flex-wrap:wrap}
button{padding:9px 12px;font-size:17px;border-radius:8px;cursor:pointer;border:1px solid #ccc;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid #b45a71;outline-offset:2px}
.small-btn{font-size:20px;font-weight:bold;min-width:40px;min-height:42px;background:#f7eeea}
.qty{width:62px;min-height:42px;text-align:center;border:1px solid #aaa;border-radius:7px;font-size:19px;font-weight:bold;padding:4px}
.add-btn{background:#ffd9d9;font-size:18px;font-weight:bold;min-height:42px;flex:1;min-width:92px}
.cart-section{background:white;padding:17px;border-radius:12px;box-shadow:0 2px 6px #ccc;position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column}
.cart-section h2{margin:0 0 12px;font-size:24px}
#c{min-height:100px;overflow-y:auto;max-height:55vh}
.cart-item{padding:12px 0;border-bottom:1px solid #eee}
.cart-name{font-size:18px;font-weight:bold;margin-bottom:8px}
.cart-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item-subtotal{margin-left:auto;font-size:17px;font-weight:bold}
.delete{background:#f3f3f3}
#t{font-size:24px;margin:16px 0}
.cart-buttons{display:flex;gap:7px}
.cart-buttons button{font-size:19px;font-weight:bold;min-height:50px}
#result-count{font-size:16px;color:#705e55}
.empty{font-size:19px;padding:24px;text-align:center;background:white;border-radius:10px;color:#666}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;justify-content:center;align-items:center;padding:15px}
.modal-content{background:white;padding:24px;border-radius:20px;width:100%;max-width:440px;text-align:center;box-shadow:0 4px 12px #0003}
#receipt-content{font-size:17px;margin:20px 0;white-space:pre-wrap;text-align:left;max-height:45vh;overflow-y:auto;background:#f9f9f9;padding:12px;border-radius:8px}
/* 넓고 읽기 쉬운 영수증 팝업 (PC/태블릿/휴대폰 대응) */
#receipt-modal .modal-content{width:min(96vw,820px);max-width:820px;max-height:92dvh;padding:clamp(18px,3vw,38px);display:flex;flex-direction:column;overflow:hidden}
#receipt-modal h2{font-size:clamp(27px,3.5vw,38px);margin:0 0 12px}
#receipt-modal #receipt-content{font-size:clamp(20px,2.3vw,26px);line-height:1.7;margin:12px 0 20px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:none;min-height:160px;overflow-y:auto;flex:1;padding:clamp(15px,2.8vw,30px);background:#fff8f1;border:2px solid #eedbd3}
#receipt-modal button{font-size:clamp(20px,2.5vw,26px);min-height:62px;flex-shrink:0}
@media(max-width:460px){#receipt-modal{padding:8px}#receipt-modal .modal-content{width:100%;max-height:94dvh;padding:16px;border-radius:16px}#receipt-modal #receipt-content{font-size:20px;line-height:1.6;padding:13px;min-height:120px}#receipt-modal button{min-height:56px}}
@media(max-width:850px){.main-container{grid-template-columns:1fr}.cart-section{position:relative;top:0;max-height:none;order:2}#c{max-height:none}.card img{height:245px}}
@media(max-width:460px){body{padding:7px}h1{font-size:23px}.product-section{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{min-height:365px;padding:7px}.card img{height:200px}.product-name{font-size:22px}.price{font-size:20px}.purchase-controls{gap:3px}.small-btn{min-width:34px;padding:7px}.qty{width:49px}.add-btn{width:100%;flex-basis:100%}.tab{flex:1;padding:10px 8px}}
</style>
</head>

// 품목표에서 마가렛쿠키부터 마지막 차 제품까지 식품입니다.
const foodNames = new Set(['마가렛쿠키','크린베리쿠키','초코프레첼','오란다','호두정과','꾀돌이','두부칩','나나콘','바나나칩','미세플라스틱제외필터 드립백','페퍼민트/스피아민트차']);
const currency = n => '₩' + n.toLocaleString('ko-KR');
const escapeHtml = value => String(value).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
let cart;
try { const saved = JSON.parse(localStorage.getItem('cart') || '[]'); cart = Array.isArray(saved) ? saved.filter(x=>x&&typeof x.name==='string'&&Number.isFinite(x.pr)&&Number.isInteger(x.q)&&x.q>0) : []; } catch { cart=[]; }
let category='all';
let confirmCallback=null;
const quantitySelections = Object.create(null);
function getSelectedQty(idx){return quantitySelections[idx] || 1;}
function changeSelected(idx,delta){setSelected(idx,getSelectedQty(idx)+delta);}
function setSelected(idx,val){const n=Number(val);quantitySelections[idx]=Number.isInteger(n)&&n>=1?Math.min(n,9999):1;const input=document.getElementById('selected-'+idx);if(input)input.value=quantitySelections[idx];}
function addProduct(idx){const [name,pr]=products[idx];const q=getSelectedQty(idx);const item=cart.find(x=>x.name===name);if(item)item.q+=q;else cart.push({name,pr,q});save();setSelected(idx,1);}
function renderProducts(){
 const query=document.getElementById('search').value.trim().toLocaleLowerCase();
 const container=document.getElementById('products-container');container.innerHTML='';
 let count=0;
 for(const kind of ['goods','food']){
  if(category!=='all'&&category!==kind)continue;
  const entries=products.map((x,i)=>({x,i})).filter(({x})=>(foodNames.has(x[0])?'food':'goods')===kind && x[0].toLocaleLowerCase().includes(query));
  if(!entries.length)continue;
  count+=entries.length;
  const heading=document.createElement('h2');heading.className='category-heading';heading.textContent=(kind==='goods'?'👜 물품':'🍪 식품')+' ('+entries.length+'개)';container.appendChild(heading);
  const grid=document.createElement('div');grid.className='product-section';
  for(const {x,i} of entries){
   const el=document.createElement('article');el.className='card';
   el.innerHTML=`<img src="${x[2]}" alt="${escapeHtml(x[0])} 사진" loading="lazy"><div class="product-name">${escapeHtml(x[0])}</div><div class="price">${currency(x[1])}</div><div class="purchase-controls"><button type="button" class="small-btn" aria-label="${escapeHtml(x[0])} 수량 감소">−</button><input type="number" class="qty" id="selected-${i}" min="1" max="9999" step="1" value="${getSelectedQty(i)}" aria-label="${escapeHtml(x[0])} 선택 수량"><button type="button" class="small-btn" aria-label="${escapeHtml(x[0])} 수량 증가">+</button><button type="button" class="add-btn">담기</button></div>`;
   const btns=el.querySelectorAll('button');btns[0].onclick=()=>changeSelected(i,-1);btns[1].onclick=()=>changeSelected(i,1);btns[2].onclick=()=>addProduct(i);
   const input=el.querySelector('input');input.addEventListener('change',()=>setSelected(i,input.value));input.addEventListener('blur',()=>setSelected(i,input.value));
   grid.appendChild(el);
  }
  container.appendChild(grid);
 }
 document.getElementById('result-count').textContent=count+'개 상품 표시';
 if(count===0){const no=document.createElement('div');no.className='empty';no.textContent='검색 결과가 없습니다.';container.appendChild(no);}
}
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{category=tab.dataset.category;document.querySelectorAll('.tab').forEach(b=>{const selected=b===tab;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected));});renderProducts();}));
document.getElementById('search').addEventListener('input',renderProducts);
function save(){localStorage.setItem('cart',JSON.stringify(cart));drawCart();}
function adjustCart(i,d){if(!cart[i])return;cart[i].q+=d;if(cart[i].q<=0)cart.splice(i,1);save();}
function setCartQty(i,val){if(!cart[i])return;const n=Number(val);if(!Number.isInteger(n)||n<1){drawCart();return;}cart[i].q=Math.min(9999,n);save();}
function removeCart(i){cart.splice(i,1);save();}
function drawCart(){
 const container=document.getElementById('c');container.innerHTML='';
 let total=0;
 if(!cart.length){const e=document.createElement('div');e.className='empty';e.textContent='상품을 선택해 주세요.';container.appendChild(e);}
 cart.forEach((item,i)=>{
  total+=item.pr*item.q;
  const el=document.createElement('div');el.className='cart-item';
  el.innerHTML=`<div class="cart-name">${escapeHtml(item.name)}</div><div class="cart-actions"><button type="button" class="small-btn" aria-label="${escapeHtml(item.name)} 1개 감소">−</button><input type="number" class="qty" min="1" max="9999" step="1" value="${item.q}" aria-label="${escapeHtml(item.name)} 장바구니 수량"><button type="button" class="small-btn" aria-label="${escapeHtml(item.name)} 1개 증가">+</button><button type="button" class="delete" aria-label="${escapeHtml(item.name)} 삭제">🗑️</button><span class="item-subtotal">${currency(item.pr*item.q)}</span></div>`;
  const bs=el.querySelectorAll('button');bs[0].onclick=()=>adjustCart(i,-1);bs[1].onclick=()=>adjustCart(i,1);bs[2].onclick=()=>removeCart(i);el.querySelector('input').addEventListener('change',e=>setCartQty(i,e.target.value));
  container.appendChild(el);
 });
 document.getElementById('t').textContent='합계 '+currency(total);
}
function showAlert(title,message){document.getElementById('alert-title').textContent=title;document.getElementById('alert-message').textContent=message;document.getElementById('alert-cancel-btn').style.display='none';confirmCallback=null;document.getElementById('alert-modal').style.display='flex';}
function showConfirm(title,message,callback){document.getElementById('alert-title').textContent=title;document.getElementById('alert-message').textContent=message;document.getElementById('alert-cancel-btn').style.display='block';confirmCallback=callback;document.getElementById('alert-modal').style.display='flex';}
function closeAlert(){document.getElementById('alert-modal').style.display='none';const callback=confirmCallback;confirmCallback=null;if(callback)callback();}
function closeAlertCancel(){document.getElementById('alert-modal').style.display='none';confirmCallback=null;}
function confirmClearCart(){if(!cart.length){showAlert('알림','장바구니가 비어 있습니다.');return;}showConfirm('장바구니 비우기','장바구니를 비울까요?',()=>{cart=[];save();});}
function pay(){if(!cart.length){showAlert('알림','장바구니가 비었습니다.');return;}let sum=0;const lines=cart.map(x=>{sum+=x.pr*x.q;return `${x.name} × ${x.q} = ${currency(x.pr*x.q)}`;});document.getElementById('receipt-content').textContent=lines.join('\n')+'\n----------------\n총 합계: '+currency(sum);document.getElementById('receipt-modal').style.display='flex';}
function closeReceipt(){document.getElementById('receipt-modal').style.display='none';cart=[];save();}
renderProducts();drawCart();
</script>

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(error => console.warn('오프라인 앱 등록 실패:', error));
  });
}
</script>
